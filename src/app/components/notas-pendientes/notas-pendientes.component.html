<div class="notas-pendientes-container">
  <div class="header">
    <h1>
      <mat-icon>pending_actions</mat-icon>
      Notas Pendientes de Aprobación
    </h1>
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="notasPendientes" class="notas-table">
        <ng-container matColumnDef="alumno">
          <th mat-header-cell *matHeaderCellDef>Alumno</th>
          <td mat-cell *matCellDef="let nota">{{ getAlumnoNombre(nota.alumnoId) }}</td>
        </ng-container>

        <ng-container matColumnDef="materia">
          <th mat-header-cell *matHeaderCellDef>Materia</th>
          <td mat-cell *matCellDef="let nota">{{ nota.materiaId }}</td>
        </ng-container>

        <ng-container matColumnDef="calificacion">
          <th mat-header-cell *matHeaderCellDef>Calificación</th>
          <td mat-cell *matCellDef="let nota">{{ nota.calificacion }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let nota">{{ nota.tipo }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let nota">{{ nota.fecha | date:'short' }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let nota">
            @if (permissionsService.puedeVer('aprobarNotasFinales')) {
              <button mat-raised-button color="primary" (click)="aprobarNota(nota.id)">
                <mat-icon>check</mat-icon>
                Aprobar
              </button>
              <button mat-raised-button color="warn" (click)="rechazarNota(nota.id)">
                <mat-icon>close</mat-icon>
                Rechazar
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
