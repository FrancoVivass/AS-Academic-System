name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gestion-academica/package-lock.json
      
      - name: Install dependencies
        working-directory: ./gestion-academica
        run: npm ci
      
      - name: Build
        working-directory: ./gestion-academica
        run: npm run build
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: as-academic-system
          directory: ./gestion-academica/dist/gestion-academica/browser
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
